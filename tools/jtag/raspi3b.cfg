#
# Inferno on the Raspberry Pi 3B, over JTAG.
#
#	openocd -f interface/<your-adapter>.cfg -f tools/jtag/raspi3b.cfg
#	telnet localhost 4444
#	> load_inferno
#	> resume
#
# The board and chip come from OpenOCD's own board/rpi3.cfg, which
# sources target/bcm2837.cfg.  This file adds only the part that is
# about Inferno rather than about the hardware.
#
# It used to be a hand-written config that declared the DAP, the four
# A53s, their debug and CTI base addresses and the TAP id itself.  Most
# of that agreed with OpenOCD's -- and one line did not: it set
# "srst type trst_and_srst" when a Pi exposes TRST and no system reset
# at all, which board/rpi3.cfg says in as many words.  A config that is
# ninety per cent a copy of a shipped one, with a wrong line in the
# other ten, is worse than no config: it looks reviewed.
#
source [find board/rpi3.cfg]

#
# And slower than target/bcm2837.cfg's 4MHz, set AFTER sourcing it so
# it wins.  "-c 'adapter speed 1000'" before the -f does not: the
# target config sets 4000 when it is read, and the last writer takes
# it.  The A53s come out of reset slow and jumper wire to a header is
# not a controlled-impedance anything; 1MHz enumerates where 4 does
# not, and it can be raised once the chain answers.
#
adapter speed 1000

#
# Load a kernel straight into RAM, which is the whole reason for this.
#
# 0x80000 is where the board's mkfile links it (-T$KTZERO) and where
# the VideoCore firmware would have put it, so the image needs no
# relocation and the pc goes to the same place the firmware would have
# jumped to.  kernel8.img is already the flat image -- mkrawimg.py has
# stripped the ELF wrapper down to the loadable segments -- so it loads
# as a plain binary.
#
# Nothing here resets the machine, on purpose: a reset hands control
# back to the firmware, which loads whatever is on the card and undoes
# the point of loading over JTAG.
#
#
# Restart Inferno with a kernel loaded over JTAG.
#
# JTAG replaces memory; it does not recreate the architectural reset
# state.  A kernel entry assumes the machine the firmware hands over --
# MMU off, caches off, nothing mapped -- and a halted running kernel
# has none of that: SCTLR_EL1 has M, C and I set, TTBR0_EL1 points at
# live tables, VBAR_EL1 at live vectors, the TLBs are full.  Jumping
# straight to 0x80000 faults on the first instruction, and did:
#
#	kstack524904 esr fffb7fb9 pc 00080000
#
# So the pc goes to the trampoline instead.  l.s's jtagstub masks
# exceptions, cleans the image range to the point of coherency, turns
# off the MMU and caches, invalidates the TLBs, clears TTBR0/1 and
# VBAR, and branches to 0x80000 with x0 = 0x4a544147 ("JTAG") so the
# kernel can tell a warm restart from a cold boot.  The kernel copies
# it to 0x70000 at boot -- below the load address, so the image cannot
# overwrite the code that is about to enter it -- and prints
# JTAG-STUB when it does.
#
# The stub is written here rather than relied on being resident.  The
# kernel does copy it to 0x70000 at boot and says so ("JTAG-STUB n
# bytes at 0x70000"), but that copy belongs to whichever kernel is
# running: against a board booted from an older card it is an older
# stub, and against a kernel that wedged before jtagstubinstall it is
# not there at all.  A debugger that needs the program it is debugging
# to have installed the debugger's entry code has the dependency
# backwards, and it fails in exactly the case the debugger exists for.
# jtagstub.bin is cut from the same linked image by tools/jtag/
# checkstub when kernel8.img is built, so the two cannot drift.
#
# All four cores are halted, not just cpu0.  Cores 2 and 3 were
# observed at EL2H, pc 0x7c, MMU off -- the VideoCore firmware's spin
# table, never in kernel text at all, because this kernel starts no
# secondaries.  (An earlier version of this comment claimed they park
# at WFE inside the kernel; they do not.)  Halting them is still
# right: it costs nothing and it means no core is executing while
# memory is replaced.  Only cpu0 is resumed.
#
# The argument list is on one line because Jim Tcl reads a backslash
# continuation inside the braces as an argument in its own right
# ("Error: argument with no name").

#
# Quiesce the SoC before re-entering the kernel.
#
# A JTAG warm restart is not a reset.  It halts the cores and changes
# the pc; every peripheral is left exactly as the previous kernel had
# it, and on this board that is not academic.  Three consecutive warm
# restarts hung at the same instruction -- right after "conf raspi3b
# ... jit 0", with cpu0 in trap+0x238 -- and the state they inherited
# was the one the SD driver prints when a DMA write stalls:
#
#	dma cs 0x21 ... (engine still active)
#	emmc status 0x1ef0106 interrupt 0x10
#
# CS 0x21 is ACTIVE|DREQ_STOPS_DMA.  A channel left like that can go
# on reading control blocks out of memory the new kernel is about to
# use for something else, and the eMMC is left mid-transaction with
# interrupts pending.
#
# This reports what it finds before touching anything, because the
# point is to learn whether inherited state is the cause, not merely
# to make the symptom go away.
#
proc quiesce { } {
	targets bcm2837.cpu0

	# BCM2835 DMA, channels 0-14 at 0x3f007000 + c*0x100.
	# CS: RESET 1<<31, ABORT 1<<30, INT 1<<2, END 1<<1, ACTIVE 1<<0
	set active {}
	for {set c 0} {$c < 15} {incr c} {
		set base [expr {0x3f007000 + $c * 0x100}]
		set cs [read_memory $base 32 1]
		if {$cs & 1} {
			lappend active [format "ch%d cs %#x conblk %#x" $c $cs \
				[read_memory [expr {$base+4}] 32 1]]
		}
	}
	if {[llength $active] == 0} {
		echo "quiesce: no DMA channel was active"
	} else {
		echo "quiesce: DMA channels STILL ACTIVE on entry:"
		foreach a $active { echo "  $a" }
	}
	for {set c 0} {$c < 15} {incr c} {
		set base [expr {0x3f007000 + $c * 0x100}]
		write_memory $base 32 [list [expr {1 << 30}]]	;# ABORT
		write_memory $base 32 [list [expr {1 << 31}]]	;# RESET
		write_memory $base 32 [list 6]			;# clear INT|END
	}

	# Arasan eMMC at 0x3f300000: mask its interrupts, reset the
	# command and data circuits, clear what is pending.
	set st [read_memory 0x3f300024 32 1]
	set ir [read_memory 0x3f300030 32 1]
	echo [format "quiesce: emmc status %#x interrupt %#x (cmdinhibit %d datinhibit %d)" \
		$st $ir [expr {$st & 1}] [expr {($st >> 1) & 1}]]
	write_memory 0x3f300038 32 [list 0]		;# irpt_en
	write_memory 0x3f300034 32 [list 0]		;# irpt_mask
	set c1 [read_memory 0x3f30002c 32 1]
	write_memory 0x3f30002c 32 [list [expr {$c1 | (1<<25) | (1<<26)}]]
	write_memory 0x3f300030 32 [list 0xffffffff]	;# clear interrupt

	# BCM2835 interrupt controller at 0x3f00b200: disable everything.
	write_memory 0x3f00b224 32 [list 0xffffffff]	;# disable basic
	write_memory 0x3f00b21c 32 [list 0xffffffff]	;# disable irq 1
	write_memory 0x3f00b220 32 [list 0xffffffff]	;# disable irq 2

	# And say what is left, so the claim is checkable.
	set left 0
	for {set c 0} {$c < 15} {incr c} {
		set cs [read_memory [expr {0x3f007000 + $c * 0x100}] 32 1]
		if {$cs & 1} { incr left }
	}
	set st [read_memory 0x3f300024 32 1]
	echo [format "quiesce: after -- %d DMA channels active, emmc status %#x" \
		$left $st]
}

proc jtagrestart { {img "os/inferno/raspi3b/kernel8.img"} {stub "os/inferno/raspi3b/jtagstub.bin"} } {
	targets bcm2837.cpu0
	halt
	foreach c {1 2 3} {
		catch { targets bcm2837.cpu$c ; halt }
	}
	targets bcm2837.cpu0
	quiesce
	if {$img ne ""} { load_image $img 0x80000 bin }
	load_image $stub 0x70000 bin
	reg pc 0x70000
	# Read it back rather than trusting the write.  "reg pc" prints
	# "pc (/64): 0x...", so take the last word of what it returns.
	echo "stub at 0x70000, image '$img', [reg pc].  'resume' to go."
}

#
# The trampoline alone, with memory left as it is: no image load, so
# 0x80000 still holds the text of the kernel that is running.  A
# successful resume reboots the board into the kernel already in RAM
# and prints its banner.  That separates "the trampoline works" from
# "the loaded image is good", which one shot conflates.
#
proc jtagbounce { } {
	jtagrestart ""
}

#
# Which stub is actually resident at 0x70000, and does stepping work.
# Reads before writing anything, so it also answers whether the
# kernel's own memmove and cacheflush put the right bytes there -- a
# thing nothing had ever checked.
#
proc jtagprobe { } {
	targets bcm2837.cpu0
	halt
	echo "resident stub at 0x70000:"
	foreach a {0x70000 0x70004 0x70008 0x7000c 0x70010} {
		echo [format "  %#x  %08x" $a [read_memory $a 32 1]]
	}
	echo "word 3 is 0xd2a00101 for the MOVZ stub, 0x18017c61 for the"
	echo "old literal-load one that could not work."
}
#
# What the SD driver was being asked one rebuild at a time.  The Arasan
# is at 0x3f300000 and these are the registers the DMA stall was
# diagnosed from; reading them at a breakpoint is the thing that took a
# release cycle per question before.
#
proc emmcregs { } {
	echo [format "status     %#10.8x" [read_memory 0x3f300024 32 1]]
	echo [format "interrupt  %#10.8x" [read_memory 0x3f300030 32 1]]
	echo [format "irpt_mask  %#10.8x" [read_memory 0x3f300034 32 1]]
	echo [format "irpt_en    %#10.8x" [read_memory 0x3f300038 32 1]]
	echo [format "control0   %#10.8x" [read_memory 0x3f300028 32 1]]
	echo [format "control1   %#10.8x" [read_memory 0x3f30002c 32 1]]
	echo [format "blksizecnt %#10.8x" [read_memory 0x3f300004 32 1]]
}

# proc returns its own name in Jim Tcl and OpenOCD prints the result of
# the last command in a config file, so end on one that says nothing.
set _ ""
