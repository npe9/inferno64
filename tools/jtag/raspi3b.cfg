#
# OpenOCD for the Raspberry Pi 3B's BCM2837, over the header's JTAG
# pins (config.txt: enable_jtag_gpio=1).
#
#	openocd -f tools/jtag/raspi3b.cfg
#	telnet localhost 4444
#
# Then, to load a kernel without going near the card:
#
#	halt
#	load_image os/inferno/raspi3b/kernel8.img 0x80000 bin
#	reg pc 0x80000
#	resume
#
# which is the whole reason this file exists.  Writing a kernel to the
# card means 1.9MB through a filesystem server that is itself under
# test, and twice that silently installed the wrong bytes.
#
# ADAPTER.  Nothing here names one, because that is the one part that
# depends on what is on the desk.  Source an adapter file first, or put
# its lines above this one:
#
#	source [find interface/ftdi/olimex-arm-usb-tiny-h.cfg]
#	adapter speed 1000
#
# Start slow.  The A53s come out of reset at a low clock and a fast
# adapter simply will not see them; 1MHz works and can be raised once
# something answers.
#

if { [info exists CHIPNAME] } {
	set _CHIPNAME $CHIPNAME
} else {
	set _CHIPNAME bcm2837
}

#
# Four cores, and this kernel parks three of them at WFE in l.s before
# anything else runs (see the board's own notes on why: QEMU and the
# real SoC both start all four at 0x80000).  They are declared anyway
# -- a parked core still has a debug interface, and asking the DAP
# about a core that exists is cheaper than discovering later that the
# one you want is not core 0.
#
set _DAP_TAPID 0x4ba00477

adapter srst type trst_and_srst

jtag newtap $_CHIPNAME cpu -irlen 4 -expected-id $_DAP_TAPID
dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

#
# The debug APB base addresses for the four A53s.  They are 0x2000
# apart, which is the only thing about this that is not guesswork from
# the outside: the BCM2837 places its CoreSight components at these
# offsets and every other Pi 3 config in circulation agrees.
#
set _cores 4
set _DBGBASE {0x80010000 0x80012000 0x80014000 0x80016000}
set _CTIBASE {0x80018000 0x80019000 0x8001a000 0x8001b000}

for { set _core 0 } { $_core < $_cores } { incr _core } {
	cti create $_CHIPNAME.cti$_core -dap $_CHIPNAME.dap -ap-num 0 \
		-baseaddr [lindex $_CTIBASE $_core]
	target create $_CHIPNAME.cpu$_core aarch64 \
		-dap $_CHIPNAME.dap \
		-dbgbase [lindex $_DBGBASE $_core] \
		-cti $_CHIPNAME.cti$_core \
		-coreid $_core
	#
	# Only core 0 runs this kernel; the others are at WFE and will
	# not answer a halt in any useful way, so do not gate startup on
	# them.
	#
	if { $_core != 0 } {
		$_CHIPNAME.cpu$_core configure -defer-examine
	}
}

targets $_CHIPNAME.cpu0

#
# The kernel is linked at 0x80000 and the firmware loads it there
# (mkfile: -T$KTZERO), so that is where an image goes and where the pc
# is set.  Nothing here resets the machine: a reset hands control back
# to the VideoCore firmware, which will load whatever is on the card
# and undo the point of this.
#
proc load_inferno { {img "os/inferno/raspi3b/kernel8.img"} } {
	halt
	load_image $img 0x80000 bin
	reg pc 0x80000
	echo "loaded $img at 0x80000; resume to run it"
}
