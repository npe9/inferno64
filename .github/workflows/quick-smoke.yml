name: Quick smoketest (compile/load)

on:
  push:
  pull_request:

jobs:
  smoketest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxft-dev libasound2-dev libgl1-mesa-dev libfreetype6-dev

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update || true
          brew install pkg-config || true

      - name: Build (best-effort)
        run: |
          set -e
          echo "Attempting to build project tools (limbo/emu) — best effort"
          cd emu || exit 0
          if command -v mk >/dev/null 2>&1; then
            mk CONF=emu-x11 install || mk CONF=emu-cocoa install || mk CONF=emu-linux install || true
          elif [ -f Makefile ]; then
            make || true
          else
            echo "no build rule found in emu/ — continuing"
          fi

      - name: Bootstrap mk & build limbo (best-effort)
        run: |
          set -e
          ROOT="$GITHUB_WORKSPACE"
          echo "Bootstrapping mk and building limbo"
          # Determine platform vars
          if [ "$RUNNER_OS" = "macOS" ]; then
            SYSTARG="MacOSX"
          else
            SYSTARG="Linux"
          fi
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64|amd64) OBJTYPE=amd64 ;;
            aarch64|arm64) OBJTYPE=arm64 ;;
            *) OBJTYPE=amd64 ;;
          esac
          SYSTYPE=posix

          # try bootstrap mk (makemk.sh will place mk and libs under $ROOT/$SYSTARG/$OBJTYPE)
          if [ -x "$ROOT/makemk.sh" ]; then
            chmod +x "$ROOT/makemk.sh"
            ROOT="$ROOT" SYSTARG="$SYSTARG" OBJTYPE="$OBJTYPE" SYSTYPE="$SYSTYPE" "$ROOT/makemk.sh" || true
            MKPATH="$ROOT/$SYSTARG/$OBJTYPE/bin/mk"
            if [ -x "$MKPATH" ]; then
              echo "using mk at $MKPATH to build limbo"
              PATH="$ROOT/$SYSTARG/$OBJTYPE/bin:$PATH"
              "$MKPATH" -f "$ROOT/limbo/mkfile" || true
            else
              echo "mk not available after makemk.sh; continuing"
            fi
          else
            echo "makemk.sh missing; skipping mk bootstrap"
          fi

      - name: Compile smoketest (limbo)
        run: |
          set -e
          ROOT="$GITHUB_WORKSPACE"
          mkdir -p /tmp/smoke
          # find a limbo binary built in repo or fall back to system 'limbo'
          LIMBO=""
          if [ -x "$ROOT/$SYSTARG/$OBJTYPE/bin/limbo" ]; then LIMBO="$ROOT/$SYSTARG/$OBJTYPE/bin/limbo"; fi
          if [ -z "$LIMBO" ] && [ -x "$ROOT/bin/limbo" ]; then LIMBO="$ROOT/bin/limbo"; fi
          if [ -z "$LIMBO" ] && [ -x "$ROOT/limbo" ]; then LIMBO="$ROOT/limbo"; fi
          if [ -z "$LIMBO" ] && command -v limbo >/dev/null 2>&1; then LIMBO="limbo"; fi
          if [ -z "$LIMBO" ]; then echo "limbo not found; cannot compile smoketest"; exit 1; fi
          echo "using limbo: $LIMBO"
          $LIMBO -I "$ROOT/module" -o /tmp/smoke.dis "$ROOT/appl/temple/smoketest.sbl"

      - name: Verify smoketest artifact
        run: |
          if [ -f /tmp/smoke.dis ]; then echo "smoketest compiled: /tmp/smoke.dis"; else echo "no smoketest artifact produced"; fi
